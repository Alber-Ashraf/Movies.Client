<div class="app-layout">
  <!-- Sticky Global Header with Role Switcher & Dark Mode Toggle -->
  <app-header
    (createMovieRequested)="store.openCreateModal()"
    (roleChanged)="store.loadCatalog()"
  />

  <!-- Main Content Route Outlet -->
  <main class="main-content" id="main-content">
    <router-outlet />
  </main>

  <!-- Global Toast Notifications Stack -->
  <app-toast-container />

  <!-- Global Movie Create / Edit Modal Drawer -->
  <app-movie-form-modal
    [isOpen]="store.isEditorOpen()"
    [editingMovie]="store.editingMovie()"
    [isSubmitting]="store.isSubmitting()"
    [apiError]="store.editorError()"
    (submitted)="onSaveMovie($event)"
    (closed)="store.closeEditorModal()"
  />

  <!-- App Footer -->
  <footer class="app-footer">
    <div class="footer-container">
      <div class="footer-left">
        <span class="footer-brand">CINEMOVIES</span>
        <span class="footer-sep">•</span>
        <span class="footer-copy">Production-grade Angular 20 Client</span>
      </div>
      <div class="footer-right">
        <span class="api-target">Backend: <code>http://localhost:5211/api</code></span>
      </div>
    </div>
  </footer>
</div>
